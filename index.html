<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turner &amp; Pears Family Tree</title>
<meta name="theme-color" content="#070c1c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Cinzel;src:url(vendor/cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:Cormorant;src:url(vendor/cormorant.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:Cormorant;src:url(vendor/cormorant-italic.woff2) format('woff2');font-style:italic;font-weight:300 700;font-display:swap}
:root{--gold:#e6c172;--gold2:#b8893a;--deep:#070c1c;--panel:rgba(10,16,34,.84);--line:rgba(214,170,80,.55);--txt:#efe4c8;--mut:#b7a888}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--txt);font-family:Cormorant,Georgia,serif;font-size:17px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gold{color:var(--gold)}
h1#title{position:fixed;top:10px;left:50%;transform:translateX(-50%);margin:0;font:600 clamp(20px,3.2vw,44px) Cinzel,serif;letter-spacing:.03em;white-space:nowrap;
 background:linear-gradient(180deg,#fbe7b0 0%,#e2b764 45%,#a8772c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 18px rgba(230,180,90,.18);pointer-events:none;z-index:3}
#title:after{content:'';display:block;margin:4px auto 0;width:42%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 3px rgba(0,0,0,.35),inset 0 0 24px rgba(214,170,80,.08),0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:4}
.panel h2{margin:0 0 8px;font:600 19px Cinzel,serif;color:var(--gold);letter-spacing:.02em}
#left{top:16px;left:16px;bottom:150px;width:270px;padding:14px;display:flex;flex-direction:column}
#search{width:100%;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none}
#list{margin-top:10px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent}
.li{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.li:hover{background:rgba(214,170,80,.08)} .li.sel{border-color:var(--gold);background:rgba(214,170,80,.14)}
.li .av{width:34px;height:34px;border-radius:50%;flex:none;background:#1b2036 center/cover;border:1px solid var(--gold2);display:grid;place-items:center;font:600 12px Cinzel,serif;color:var(--gold)}
.li b{display:block;font-weight:600;font-size:16px;line-height:1.1} .li small{color:var(--mut);font-size:13px}
.gen{font:600 12px Cinzel,serif;color:var(--gold2);margin:10px 4px 2px;letter-spacing:.08em;text-transform:uppercase}
#right{top:16px;right:16px;bottom:150px;width:330px;padding:16px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent}
#right .name{font:600 24px Cinzel,serif;color:var(--gold);text-align:center;line-height:1.15}
#right .dates{text-align:center;color:var(--txt);margin:4px 0 2px;font-size:17px}
#right .places{text-align:center;color:var(--mut);font-size:15px;line-height:1.35}
#right .sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
#right .sec h3{margin:0 0 6px;font:600 15px Cinzel,serif;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
#right .notes{white-space:pre-wrap;font-size:16px;line-height:1.35}
.rel a{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--gold2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .th{aspect-ratio:1;border:1px solid var(--gold2);border-radius:6px;background:#111 center/cover;cursor:pointer;position:relative;overflow:hidden}
.grid .th.doc{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:4px;background:#1a1610;color:var(--txt)}
.grid .th.doc i{font-style:normal;font:600 18px Cinzel,serif;color:var(--gold)}
.grid .th .star{position:absolute;top:2px;right:4px;color:var(--gold);text-shadow:0 0 4px #000}
.mini{background:none;border:1px solid var(--line);border-radius:7px;padding:1px 8px;font:13px Cormorant,serif;color:var(--gold);cursor:pointer}
.x{background:none;border:none;color:var(--mut);cursor:pointer;font-size:12px;padding:0 3px}.x:hover{color:#e66}
.mini:hover{background:rgba(214,170,80,.12)}
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(980px,calc(100vw - 32px));z-index:4;display:flex;flex-direction:column;gap:10px;align-items:center}
#tl{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:8px 18px}
#tl span{font:600 18px Cinzel,serif;color:var(--gold);min-width:46px;text-align:center}
#year{flex:1;accent-color:var(--gold);height:22px}
#yearLbl{position:relative;font:600 15px Cinzel,serif;color:var(--gold);min-width:84px!important}
#btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.b{background:linear-gradient(180deg,rgba(60,44,18,.92),rgba(24,18,8,.92));border:1px solid var(--gold2);color:var(--txt);border-radius:10px;padding:8px 16px;font:600 17px Cormorant,serif;cursor:pointer;box-shadow:inset 0 0 10px rgba(230,180,90,.15),0 2px 10px rgba(0,0,0,.5);display:flex;align-items:center;gap:7px;white-space:nowrap}
.b:hover{border-color:var(--gold);box-shadow:inset 0 0 14px rgba(230,180,90,.3),0 0 12px rgba(230,180,90,.25)}
.b.on{border-color:#ffd88a;box-shadow:0 0 14px rgba(255,210,120,.5)}
.b svg{width:18px;height:18px;fill:var(--gold)}
#hint{font-size:14px;color:var(--mut);letter-spacing:.03em}
#status{position:fixed;left:16px;bottom:118px;z-index:5;font:12px system-ui;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--mut)}
body.viewonly #btns [data-act]:not([data-act=home]):not([data-act=focus]){display:none}
#status.synced{color:#9fe0a0;border-color:#4a7}#status.blocked{color:#ffcf7a}
#topbtns{position:fixed;top:14px;left:300px;z-index:5;display:flex;gap:6px}
#mobtabs{display:none}
.modal{position:fixed;inset:0;background:rgba(2,4,10,.72);z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.box{background:#0d1428;border:1px solid var(--gold2);border-radius:14px;padding:18px 20px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 0 40px rgba(230,180,90,.15)}
.box h2{margin:0 0 12px;font:600 21px Cinzel,serif;color:var(--gold)}
.box label{display:block;font-size:14px;color:var(--mut);margin:8px 0 2px}
.box input:not([type=checkbox]),.box select,.box textarea{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-size:16px}
.box textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.danger{border-color:#a5483d!important;color:#ffb3a8!important}
#viewer .box{width:min(1100px,100%);height:92vh;display:flex;flex-direction:column;padding:12px}
#vbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
#vbody img,#vbody video{max-width:100%;max-height:100%;object-fit:contain}
#vbody iframe{width:100%;height:100%;border:0;background:#fff}
#vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
#vhead b{font:600 17px Cinzel,serif;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lock{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#121a36 0%,#050810 75%)}
#lock .box{text-align:center;width:min(440px,100%)}
#lock p{color:var(--mut);font-size:16px;margin:6px 0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1a1407;border:1px solid var(--gold);padding:8px 16px;border-radius:10px;z-index:40;font-size:16px;box-shadow:0 0 18px rgba(230,180,90,.3)}
.pick{display:grid;gap:6px;margin-top:6px}
@media (max-width:860px), (max-height:540px){
 body{font-size:16px}
 h1#title{font-size:20px;top:8px}
 #left,#right{display:none;top:48px;bottom:auto;max-height:calc(100vh - 190px);left:8px;right:8px;width:auto}
 #left.show,#right.show{display:flex;display:block}
 #left.show{display:flex}
 #bottom{bottom:6px;gap:6px;width:calc(100vw - 12px)} #tl{padding:4px 10px;gap:8px} #tl span{font-size:13px;min-width:34px}
 .b{padding:6px 9px;font-size:14px} .b .t{display:none} #btns{gap:6px} #hint{display:none}
 #status{left:8px;bottom:auto;top:72px;font-size:11px} #topbtns{left:8px;top:40px}
 #mobtabs{display:flex;gap:6px;position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:5}
}
@media (max-height:520px) and (max-width:1000px){ #bottom{gap:4px} #tl{display:none} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<h1 id="title">Turner &amp; Pears Family Tree</h1>
<div id="status">…</div>
<div id="topbtns"><button class="mini" id="bMenu" title="Backup, import, settings">☰ More</button></div>
<div id="mobtabs"><button class="mini" id="tabL">Family</button><button class="mini" id="tabR">Details</button></div>

<aside id="left" class="panel">
 <h2>🌳 Family Members</h2>
 <input id="search" placeholder="Search names…" autocomplete="off">
 <div id="list"></div>
</aside>

<aside id="right" class="panel"><div id="details"></div></aside>

<div id="bottom">
 <div id="tl" class="panel"><span>1850</span><input type="range" id="year" min="1850" max="2027" value="2027"><span id="yearLbl">All years</span></div>
 <div id="btns">
  <button class="b" data-act="child"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="4"/><path d="M5 22c0-5 3-9 7-9s7 4 7 9z"/></svg><span class="t">Add child</span></button>
  <button class="b" data-act="sibling"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3.5"/><circle cx="16.5" cy="7" r="3.5"/><path d="M1 21c0-4 3-8 7-8s7 4 7 8zM12 21c0-3 2-8 4.5-8 4 0 7 4 7 8z"/></svg><span class="t">Add sibling</span></button>
  <button class="b" data-act="spouse"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span class="t">Add spouse</span></button>
  <button class="b" data-act="parent"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3.5"/><circle cx="16" cy="7" r="3.5"/><path d="M1 21c0-4 3-8 7-8s7 4 7 8zM9 21c0-4 3-8 7-8s7 4 7 8z"/></svg><span class="t">Add parent</span></button>
  <button class="b" data-act="edit"><svg viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L18 9.7 14.3 6zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8L19 8.8z"/></svg><span class="t">Edit</span></button>
  <button class="b" data-act="focus" id="bFocus"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span class="t">Focus line</span></button>
  <button class="b" data-act="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg><span class="t">Centre</span></button>
 </div>
 <div id="hint">Drag to rotate • Scroll or pinch to zoom • Right-drag to pan • Click a frame to select</div>
</div>

<div class="modal" id="dlg"><div class="box" id="dlgBox"></div></div>
<div class="modal" id="viewer"><div class="box"><div id="vhead"><b id="vtitle"></b><span id="vacts"></span></div><div id="vbody"></div></div></div>
<div id="lock" style="display:none"><div class="box" id="lockBox"></div></div>
<input type="file" id="fileIn" hidden>

<script src="config.js?v=202611171608"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
<script type="module" src="app.js?v=202611171608"></script>
<script>if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js?v=202611171608')</script>
</body>
</html>
